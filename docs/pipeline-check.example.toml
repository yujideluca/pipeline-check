projeto = "my-project"
aviso_a = 0.8                 # warn from 80 % of a limit, fail at 100 %

[gate]
command = "tools/quality_gate.sh"
required = true

[architecture]
pure_dirs = ["core/src"]                 # sources that must not import the forbidden packages
build_files = ["core/build.gradle.kts"]  # build files that must not name them
# forbidden = ["android", "androidx"]    # default

[[fitness]]
id = "arquivo-maior"
kind = "max_file_lines"                  # or "file_size" (path = "...") or "gate_seconds"
limit = 400
dirs = ["core/src"]
extensions = ["kt"]

[[fitness]]
id = "gate-segundos"
kind = "gate_seconds"
limit = 1200

[github]                                 # local mode only
repo = "yujideluca/my-project"
branch = "main"
required_check = "gate"

[dora]
days = 30
# feed_path = "~/dev/my-releases"
decision_log = "DESIGN.md"

[traceability]                           # optional: `pipeline-check --traceability` (REQ tags in tests, PC-14)
# requirements = "docs/REQUIREMENTS.md"  # defaults
# matrix = "docs/TRACEABILITY.md"
[[traceability.sources]]
dir = "tests"                            # relative to the root, or ~/...; a missing folder contributes nothing
extensions = ["py", "kt", "js"]
# label = "web"                          # shown before the file name in the matrix
# env = "QUIZWEB"                        # when set, replaces dir
